name: CI/CD Pipeline

on:
  push:
    branches:
      - main # runs on push to main
  pull_request:
    branches:
      - main

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js app
      - name: Build Next.js
        run: npm run build

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -t sm-tech-frontend .

      # 7. Tag and push Docker image
      - name: Push Docker image to Docker Hub
        run: |
          docker tag sm-tech-frontend ${{ secrets.DOCKER_USERNAME }}/sm-tech-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sm-tech-frontend:latest
